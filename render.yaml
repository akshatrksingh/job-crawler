services:
  - type: web
    name: job-crawler
    env: docker
    plan: starter
    autoDeploy: false
    healthCheckPath: /health
    disk:
      name: job-crawler-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JOB_CRAWLER_DB_PATH
        value: /var/data/job_crawler.sqlite
      - key: JOB_CRAWLER_AUTH_USERNAME
        sync: false
      - key: JOB_CRAWLER_AUTH_PASSWORD
        sync: false
